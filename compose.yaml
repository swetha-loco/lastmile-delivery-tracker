services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lastmile
      POSTGRES_USER: lastmile
      POSTGRES_PASSWORD: lastmile
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastmile -d lastmile"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
